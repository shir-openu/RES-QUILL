name: Deploy Flutter Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build web for GitHub Pages project URL
        # Project Pages are served below /res-quill/. If this base href is wrong,
        # Flutter's bootstrap and asset URLs resolve from the wrong path and the page can load blank.
        # web/flutter_bootstrap.js intentionally omits serviceWorkerSettings so Pages visits do not use a stale offline cache.
        run: flutter build web --release --base-href /res-quill/

      - name: Remove generated service worker
        run: rm -f build/web/flutter_service_worker.js

      - name: Add Pages no-Jekyll marker
        run: touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
